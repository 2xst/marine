app = "marine"
primary_region = "ams"

[build]
  image = "grimerssy/marine:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "3s"
  method = "GET"
  path = "/health_check"
  timeout = "3s"
  interval = "5s"
